          <script>
  document.addEventListener('DOMContentLoaded', () => {
    const tekst1 = `This website is not finished yet. 
    Please click on the links below to see my work.`;

    const p1 = document.getElementById('typewriter');
    const p2 = document.getElementById('typewriter2');

    let index = 0;
    let currentText = tekst1;

    function typeText(element, text, callback) {
      let i = 0;
      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          setTimeout(type, 30);
        } else if (callback) {
          callback();
        }
      }
      type();
    }

    // Eerst typewriter boven de banner
    typeText(p1, tekst1, () => {
      // Daarna de tweede, onder de banner
      setTimeout(() => {
        typeText(p2, tekst2);
      }, 1000); // kleine pauze tussen beide delen
    });
  });
</script>
